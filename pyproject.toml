[project]
name = "case-radar"
version = "0.1.0"
description = "Case-radar - trend- og case-scanner for journalister (Stavanger/Norge)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# KI-agenter (redaktor + journalist) via Claude API. Nokkel i server-.env.
ai = ["anthropic>=0.40"]
# Google Trends (uofisielt) - kan feile/rate-limites, derfor valgfritt.
trends = ["pytrends>=4.9"]
# Google Calendar-integrasjon (krever egen OAuth-nokkel fra brukeren).
calendar = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.0",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
