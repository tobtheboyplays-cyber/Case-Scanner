<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <title>Redaktør-assistent – innstillinger</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px;
        color: #1c1c1c;
      }
      h1 {
        font-size: 20px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 20px 0 6px;
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
      }
      button {
        margin-top: 18px;
        background: #1a5fb4;
        color: #fff;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      .ok {
        color: #2e7d32;
        margin-left: 10px;
      }
      .hjelp {
        color: #666;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Redaktør-assistent</h1>
    <p class="hjelp">
      Skriv inn adressen til serveren din (proxyen). Eksempel:
      <code>https://din-server.no</code> — utvidelsen legger selv til
      <code>/login</code> og <code>/review</code>.
    </p>
    <label for="proxyUrl">Server-adresse (proxy-URL)</label>
    <input id="proxyUrl" type="url" placeholder="https://din-server.no" />
    <div>
      <button id="lagre">Lagre</button>
      <span id="ok" class="ok"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
